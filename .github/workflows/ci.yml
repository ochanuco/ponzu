name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@e5102a8ff65b3c15a2afa263d4970dbbe6538862 # v1.1.0
    with:
      runs-on: macos-14 # Apple Silicon, matching the ADR-009 target platform.
      python-version: "3.11"
      # No extras. ADR-009 requires the package to install and the suite to run
      # without sounddevice, numpy, or faster-whisper present, so installing the
      # extras here would defeat the check. --locked fails on uv.lock drift.
      run: |
        uv sync --locked --extra dev
        uv run ruff check .
        uv run ruff format --check .
        uv run pytest -q
